<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BiOBiO Catalog</title>

  <style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
  }

  body {
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f3f8f9;
    color: #1f2a36;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 28px;
    padding: 44px 46px 56px;
    text-align: center;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
  }

  .logo {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 18px;
  }

  .subtitle {
    font-size: 16px;
    color: #4d5f70;
    line-height: 1.6;
    margin: 0 0 36px;
  }

  .button-group {
    width: 100%;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 14px;
  }

  .catalog-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 170px;
    height: 60px;
    padding: 0 18px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    transition: all 0.2s ease;
  }

  .catalog-button.ko {
    background: #243c5a;
    color: #ffffff;
  }

  .catalog-button.en {
    background: #eef3f7;
    color: #243c5a;
    border: 1px solid #d9e3ea;
  }

  .catalog-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.1);
  }

  @media (max-width: 430px) {
    .container {
      padding: 40px 22px 46px;
    }

    .button-group {
      gap: 10px;
    }

    .catalog-button {
      width: 145px;
      height: 58px;
      font-size: 14px;
    }
  }
</style>
</head>

<body>
  <main class="container">
    <div class="logo">BiOBiO</div>

    <p class="subtitle">
      Please select your catalog language.<br />
      카탈로그 언어를 선택해 주세요.
    </p>

    <div class="button-group">
      <a class="catalog-button ko" href="./ko/">
        한국어 카탈로그
      </a>

      <a class="catalog-button en" href="./en/">
        English Catalog
      </a>
    </div>
  </main>
</body>
</html>
