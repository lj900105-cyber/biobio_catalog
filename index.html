<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiOBiO Catalog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #f6fbff 0%, #eef7f5 100%);
      color: #1f2a36;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 28px;
      padding: 44px 28px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #5d6b78;
      line-height: 1.6;
      margin-bottom: 34px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .catalog-button {
      display: block;
      width: 100%;
      padding: 18px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .catalog-button.ko {
      background: #243c5a;
      color: #ffffff;
    }

    .catalog-button.en {
      background: #eef3f7;
      color: #243c5a;
      border: 1px solid #d9e3ea;
    }

    .catalog-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.1);
    }

    .notice {
      margin-top: 28px;
      font-size: 13px;
      color: #8a97a3;
      line-height: 1.5;
    }

    @media (min-width: 520px) {
      .button-group {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">BiOBiO</div>

    <p class="subtitle">
      Please select your catalog language.<br />
      카탈로그 언어를 선택해 주세요.
    </p>

    <div class="button-group">
      <a class="catalog-button ko" href="./ko/">
        한국어 카탈로그
      </a>

      <a class="catalog-button en" href="./en/">
        English Catalog
      </a>
    </div>

    <p class="notice">
      BiOBiO Product Catalog
    </p>
  </main>
</body>
</html>
